name: Build StreamVault installer

# Builds the Windows installer (app/dist/StreamVault-Setup-<version>.exe).
# Every push that changes the app or the scripts it bundles keeps the installer as a run artifact;
# pushing a tag like app-v1.1.0 also publishes it as a GitHub Release.
on:
  push:
    paths:
      - "app/**"
      - "clipper/**"
      - "uploader/**"
      - "n8n/post-shorts.json"
      - ".claude/skills/shorts-clipper/**"
      - ".github/workflows/build-app.yml"
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write   # only used to publish a Release for app-v* tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # LF line endings, so the video-use patch applies cleanly on Windows.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: StreamVault-Setup
          path: app/dist/StreamVault-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/dist/StreamVault-Setup-*.exe \
            --repo "$GITHUB_REPOSITORY" --title "StreamVault ${GITHUB_REF_NAME#app-v}" \
            --notes "Windows installer. It isn't code-signed, so SmartScreen asks once: More info → Run anyway."
